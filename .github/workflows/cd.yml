name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, staging, main]

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish-backend:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || github.event.workflow_run.head_branch == 'staging' && 'staging' || 'development' }}
    strategy:
      matrix:
        include:
          - service: api
            context: services/api
          - service: worker
            context: services/worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Resolve lowercase image name
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${repository_name}-${SERVICE}"
          echo "name=$(printf '%s' "${image_name}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_OUTPUT}"
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,value=${{ github.event.workflow_run.head_sha }}
            type=raw,value=${{ github.event.workflow_run.head_branch == 'main' && 'production-latest' || github.event.workflow_run.head_branch == 'staging' && 'staging-latest' || 'development-latest' }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-frontends:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || github.event.workflow_run.head_branch == 'staging' && 'staging' || 'development' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontends-${{ github.event.workflow_run.head_sha }}
          path: |
            apps/marketing/.next
            apps/admin/.next
            apps/storefront/.next
          include-hidden-files: true
          retention-days: 7

  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    needs: [publish-backend, build-frontends]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || github.event.workflow_run.head_branch == 'staging' && 'staging' || 'development' }}
    env:
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
    steps:
      - name: Trigger configured deployment endpoint
        if: env.DEPLOY_WEBHOOK_URL != ''
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || github.event.workflow_run.head_branch == 'staging' && 'staging' || 'development' }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          curl --fail-with-body --silent --show-error
          --request POST
          --header "Authorization: Bearer ${DEPLOY_WEBHOOK_TOKEN}"
          --header "Content-Type: application/json"
          --data "{\"environment\":\"${DEPLOY_ENVIRONMENT}\",\"sha\":\"${DEPLOY_SHA}\"}"
          "${DEPLOY_WEBHOOK_URL}"
      - name: Explain skipped deployment
        if: env.DEPLOY_WEBHOOK_URL == ''
        run: echo "Artifacts and backend images are ready; DEPLOY_WEBHOOK_URL is not configured."
